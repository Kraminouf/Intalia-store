<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTALIA STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#222}
header{background:#111;color:#d8b66a;text-align:center;padding:24px 12px}
header h1{margin:0;font-size:30px;letter-spacing:4px}
header p{color:white;margin-bottom:0}
nav{background:#222;padding:12px;text-align:center}
nav a{color:#fff;text-decoration:none;margin:0 10px;font-size:14px}
.hero{text-align:center;padding:30px 15px;background:#e9dfca}
.hero h2{color:#332710;margin:0 0 10px}
.hero p{margin:8px}
.container{max-width:1100px;margin:auto;padding:20px}
h2.section-title{text-align:center;color:#8c6b2f;margin:25px 0}
.search{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:15px}
.categories{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0 25px}
.categories button{border:1px solid #b89956;background:white;padding:10px 13px;border-radius:20px;cursor:pointer}
.categories button.active,.categories button:hover{background:#b89956;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:15px;text-align:center;box-shadow:0 2px 10px #0000000c}
.product-icon{font-size:55px;background:#f5f0e5;padding:20px;border-radius:10px}
.card h3{font-size:17px;min-height:38px}
.card p{color:#777;font-size:13px}
.price{font-weight:bold;font-size:20px;color:#9b762e}
.card button,.gold-btn{background:#b28b40;color:white;border:0;padding:12px 15px;border-radius:7px;cursor:pointer;width:100%;font-size:15px}
.card button:hover,.gold-btn:hover{background:#8e6b2b}
.panel{background:white;border-radius:12px;padding:20px;margin-top:25px;box-shadow:0 2px 10px #0000000c}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:10px 0}
.cart-row button{padding:5px 10px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #ccc;border-radius:7px;font-size:15px}
label{font-weight:bold;font-size:14px}
